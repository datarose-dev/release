name: Consumer release
on:
  workflow_dispatch:
    inputs:
      unit:
        type: string
        required: false
        default: release
      version:
        type: string
        required: false
        default: ''
      draft:
        type: string
        required: false
        default: ''
      prerelease:
        type: string
        required: false
        default: ''
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: datarose-dev/release/.github/workflows/prepare.yml@REPLACE_WITH_40_CHARACTER_SHA
    with:
      tool-ref: REPLACE_WITH_40_CHARACTER_SHA
      unit: ${{ inputs.unit }}
      version: ${{ inputs.version }}
      draft: ${{ inputs.draft }}
      prerelease: ${{ inputs.prerelease }}
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}

  update:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '@datarose-release update'
    permissions:
      contents: write
      pull-requests: write
    uses: datarose-dev/release/.github/workflows/prepare.yml@REPLACE_WITH_40_CHARACTER_SHA
    with:
      tool-ref: REPLACE_WITH_40_CHARACTER_SHA
      unit: release
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}

  publish:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: read
    uses: datarose-dev/release/.github/workflows/publish.yml@REPLACE_WITH_40_CHARACTER_SHA
    with:
      tool-ref: REPLACE_WITH_40_CHARACTER_SHA
      unit: release
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}

  build:
    needs: publish
    if: needs.publish.outputs.release-sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.release-sha }}
          persist-credentials: false
      # Add consumer-owned build commands and transfer dist/ with the existing artifact mechanism.

  upload-release-assets:
    needs: [build, publish]
    if: needs.publish.outputs.release-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # Add consumer's existing artifact-retrieval step here. Do not add write credentials to build job.
      - name: Upload release assets
        if: hashFiles('dist/*') != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
